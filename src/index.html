<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efede4">
  <meta name="description" content="EVFX downloads for After Effects, Blender and Windows.">
  <meta property="og:title" content="EVFX">
  <meta property="og:description" content="After Effects, Blender and Windows downloads.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sbilogic.github.io/evfx/">
  <link rel="canonical" href="https://sbilogic.github.io/evfx/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <title>{{TITLE}}</title>
</head>
<body id="top">
  <a class="skip-link" href="#collection">Skip to downloads</a>
  <header class="top wrap">
    <h1 class="mark"><span class="sr-only">EVFX</span><span aria-hidden="true">evfx</span></h1>
    <div class="hero-art" aria-hidden="true">{{HERO_ART}}</div>
    <nav aria-label="Main navigation"><a href="https://github.com/sbilogic/evfx/releases">All releases ↗</a>{{SUPPORT_NAV}}</nav>
  </header>
  <main id="collection" class="wrap">
    <div class="views" role="group" aria-label="Builds">
      <button type="button" data-view="complete" aria-pressed="true">Released <sup>{{COUNT}}</sup></button>
      <button type="button" data-view="development" aria-pressed="false" hidden>Development <sup>{{DEV_COUNT}}</sup></button>
      <span class="hosts">After Effects · Blender · Windows</span>
    </div>
    <p id="dev-banner" class="dev-banner" role="note" hidden><b>⚠ Development builds</b> are unfinished or untested. They may crash or change between builds. Use a test project and keep backups.</p>
    <p id="results-count" class="sr-only" role="status" aria-live="polite"></p>
    <div class="grid">{{TOOLS}}</div>
    <noscript><p class="noscript">Development builds need JavaScript.</p></noscript>
  </main>
  <footer class="foot wrap"><span>© {{YEAR}} Sahil Bloch</span><a href="https://github.com/sbilogic/evfx">Source ↗</a></footer>
</body>
</html>
