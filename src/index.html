<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="Download EVFX plugins and tools for After Effects, Blender and Windows. Versions, requirements, installation and build warnings.">
  <meta property="og:title" content="EVFX — Plugins & tools">
  <meta property="og:description" content="After Effects, Blender and Windows downloads.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sbilogic.github.io/evfx/">
  <link rel="canonical" href="https://sbilogic.github.io/evfx/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <title>{{TITLE}}</title>
</head>
<body id="top">
  <a class="skip-link" href="#collection">Skip to downloads</a>
  <header class="site-header wrap">
    <a class="wordmark" href="#top" aria-label="EVFX, back to top">evfx<span aria-hidden="true">✳</span></a>
    <nav aria-label="Main navigation"><a href="#collection">Downloads</a><a href="https://github.com/sbilogic/evfx/releases">Releases ↗</a>{{SUPPORT_NAV}}</nav>
  </header>
  <main>
    <section class="hero wrap" aria-labelledby="hero-title">
      <h1 id="hero-title">Plugins<br>&amp; <em>tools</em></h1>
      <div class="hero-art" aria-hidden="true">{{HERO_ART}}</div>
    </section>
    <section id="collection" class="collection wrap" aria-labelledby="collection-title">
      <h2 id="collection-title" class="sr-only">Downloads</h2>
      <div class="collection-controls">
        <div class="filters" role="group" aria-label="Filter by application">
          <button type="button" data-filter="all" aria-pressed="true">All <sup>{{COUNT}}</sup></button>
          <button type="button" data-filter="ae" aria-pressed="false">After Effects</button>
          <button type="button" data-filter="blender" aria-pressed="false">Blender</button>
          <button type="button" data-filter="windows" aria-pressed="false">Windows</button>
        </div>
        <label class="search"><span class="sr-only">Search tools</span><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="tool-search" type="search" placeholder="Search tools" autocomplete="off"></label>
      </div>
      <p id="results-count" class="sr-only" role="status" aria-live="polite">{{COUNT}} tools</p>
      <div class="tool-list">{{TOOLS}}</div>
      <div id="empty-state" class="empty-state" hidden><p>No matching tools.</p><button id="reset-filters" type="button">Reset filters</button></div>
      <noscript><p class="noscript-note">Enable JavaScript to search or filter.</p></noscript>
    </section>
    {{SUPPORT_SECTION}}
  </main>
  <footer class="site-footer wrap"><span>© {{YEAR}} Sahil Bloch</span><a href="https://github.com/sbilogic/evfx">GitHub ↗</a><a href="#top">Back to top ↑</a></footer>
</body>
</html>
