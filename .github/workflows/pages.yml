name: Publish EVFX

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh release metadata
        run: node scripts/refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check catalog
        run: node scripts/check.mjs
      - name: Verify warnings and support links
        run: node --test tests/readiness.test.mjs tests/support.test.mjs
      - name: Build static page
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
